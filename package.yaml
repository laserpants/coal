name: coal
version: 0.1.0.0
synopsis: The Coal programming language and compiler
license: MIT
license-file: LICENSE
author: "Heikki Johannes Hildén"
maintainer: "hildenjohannes@gmail.com"
copyright: "2020-present Heikki Johannes Hildén"

homepage: https://coal-lang.org
bug-reports: https://codeberg.org/laserpants/coal/issues

extra-source-files:
  - README.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

description: Please see the README at <https://codeberg.org/laserpants/coal/src/branch/main/README.md>

custom-setup:
  dependencies:
    - base
    - Cabal
    - directory
    - process

dependencies:
  - aeson >= 2.2 && < 2.3
  - aeson-pretty >= 0.8 && < 0.9
  - ansi-terminal >= 0.11 && < 2
  - base >= 4.17 && < 5
  - binary >= 0.8.9.1 && < 0.9
  - bytestring >= 0.11.5.3 && < 0.13
  - containers >= 0.6.7 && < 0.8
  - cryptonite >= 0.30 && < 0.31
  - data-default >= 0.7.1.1 && < 0.9
  - data-fix >= 0.3.2 && < 0.4
  - deriving-compat >= 0.6.5 && < 0.7
  - deepseq >= 1.4.8 && < 1.6
  - directory >= 1.3.7.1 && < 1.4
  - exceptions >= 0.10.5 && < 0.11
  - extra >= 1.7.14 && < 1.9
  - file-embed >= 0.0.15.0 && < 0.1
  - filepath >= 1.4.2.2 && < 1.6
  - free >= 5.1 && < 6
  - ir-builder >= 0.1.0.0 && < 0.2
  - megaparsec >= 9.3.1 && < 10
  - memory >= 0.18.0 && < 0.19
  - mtl >= 2.2 && < 3
  - optparse-applicative >= 0.18 && < 0.19
  - parser-combinators >= 1.3.0 && < 1.4
  - pretty-simple >= 4.1.2.0 && < 4.2
  - prettyprinter >= 1.7.1 && < 1.8
  - process >= 1.6.18.0 && < 1.7
  - process-extras >= 0.7.4 && < 0.8
  - raw-strings-qq >= 1.1 && < 1.2
  - recursion-schemes >= 5.2.2.5 && < 5.3
  - semver >= 0.4 && < 1.1
  - template-haskell >= 2.19 && < 2.24
  - temporary >= 1.3 && < 1.4
  - text >= 2.0.2 && < 2.2
  - text-show >= 3.10.4 && < 3.12
  - time >= 1.12.2 && < 1.13
  - transformers >= 0.5 && < 0.7
  - uniplate >= 1.6.13 && < 1.7

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -optP-Wno-nonportable-include-path

library:
  source-dirs: src

executables:
  coal:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      # -A: the allocation area (nursery) size. It is *per capability*, so it
      # must be read together with -N. With the default 4MB nursery the compiler
      # performs tens of thousands of minor GCs on large builds, copying many GB
      # of live data and inflating peak memory use; a moderately larger nursery
      # avoids that.
      #
      # -N is deliberately NOT set. Nothing in the compiler runs concurrently
      # (every pass is sequential), so extra capabilities buy no parallelism,
      # while multiplying the nursery by the core count and enabling the
      # parallel GC. On a 16-core machine the old "-N -A32m" reserved 16 x 32MB
      # = 512MB of nursery before any live data, and GHC only returns that
      # memory during idle collections, which a build never has.
      #
      # GHC accepts only a single -with-rtsopts flag, so the options are passed
      # in one (quoted) token. `-rtsopts` lets users override at runtime, e.g.
      # `coal build +RTS -A32m -RTS` or `GHCRTS=-M2G`.
      #
      # `-c` (compacting collector for the oldest generation) is enabled by
      # default because *peak memory*, not compile time, is the binding
      # constraint: an over-large heap sporadically aborts the compiler and can
      # take the whole machine down with it. Measured on a 42-module cold build,
      # `-c` costs ~10% wall time and buys ~30% peak RSS (1.00GB -> 0.71GB).
      # `+RTS -xn` (non-moving) is *worse* for memory (~+18% peak RSS) and
      # should not be used for this workload.
      - '"-with-rtsopts=-A16m -c"'
    dependencies:
      - coal

tests:
  coal-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      # Same nursery/collector rationale as the `coal` executable above: the
      # test suite compiles many programs in one process, all sequentially.
      - '"-with-rtsopts=-A16m -c"'
    dependencies:
      - coal
      - hspec >= 2.10.10 && < 2.12

benchmarks:
  coal-bench-compiler:
    main: Main.hs
    source-dirs: bench/compiler
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -O2
    dependencies:
      - coal
      - criterion >= 1.6 && < 1.7
      - deepseq >= 1.4 && < 1.6
