name: coal
version: 0.1.0.0
synopsis: The Coal programming language and compiler
license: MIT
license-file: LICENSE
author: "Heikki Johannes Hildén"
maintainer: "hildenjohannes@gmail.com"
copyright: "2020-present Heikki Johannes Hildén"

homepage: https://coal-lang.org
bug-reports: https://codeberg.org/laserpants/coal/issues

extra-source-files:
  - README.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

description: Please see the README at <https://codeberg.org/laserpants/coal/src/branch/main/README.md>

custom-setup:
  dependencies:
    - base
    - Cabal
    - directory
    - process

dependencies:
  - aeson >= 2.2 && < 2.3
  - aeson-pretty >= 0.8 && < 0.9
  - ansi-terminal >= 0.11 && < 2
  - base >= 4.17 && < 5
  - binary >= 0.8.9.1 && < 0.9
  - bytestring >= 0.11.5.3 && < 0.13
  - containers >= 0.6.7 && < 0.8
  - cryptonite >= 0.30 && < 0.31
  - data-default >= 0.7.1.1 && < 0.9
  - data-fix >= 0.3.2 && < 0.4
  - deriving-compat >= 0.6.5 && < 0.7
  - directory >= 1.3.7.1 && < 1.4
  - exceptions >= 0.10.5 && < 0.11
  - extra >= 1.7.14 && < 1.9
  - file-embed >= 0.0.15.0 && < 0.1
  - filepath >= 1.4.2.2 && < 1.6
  - free >= 5.1 && < 6
  - ir-builder >= 0.1.0.0 && < 0.2
  - megaparsec >= 9.3.1 && < 10
  - memory >= 0.18.0 && < 0.19
  - mtl >= 2.2 && < 3
  - optparse-applicative >= 0.18 && < 0.19
  - parser-combinators >= 1.3.0 && < 1.4
  - pretty-simple >= 4.1.2.0 && < 4.2
  - prettyprinter >= 1.7.1 && < 1.8
  - process >= 1.6.18.0 && < 1.7
  - process-extras >= 0.7.4 && < 0.8
  - raw-strings-qq >= 1.1 && < 1.2
  - recursion-schemes >= 5.2.2.5 && < 5.3
  - semver >= 0.4 && < 1.1
  - template-haskell >= 2.19 && < 2.24
  - temporary >= 1.3 && < 1.4
  - text >= 2.0.2 && < 2.2
  - text-show >= 3.10.4 && < 3.12
  - time >= 1.12.2 && < 1.13
  - transformers >= 0.5 && < 0.7
  - uniplate >= 1.6.13 && < 1.7

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -optP-Wno-nonportable-include-path

library:
  source-dirs: src

executables:
  coal:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      # -N: parallel GC. -A32m: a large allocation area per capability; with
      # the tiny default nursery the compiler performs tens of thousands of
      # minor GCs on large builds, copying many GB of live data and inflating
      # peak memory use to the point of heap exhaustion. GHC accepts only a
      # single -with-rtsopts flag, so both options are passed in one
      # (quoted) token.
      - '"-with-rtsopts=-N -A32m"'
    dependencies:
      - coal

tests:
  coal-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - coal
      - hspec >= 2.10.10 && < 2.12

benchmarks:
  coal-bench-compiler:
    main: Main.hs
    source-dirs: bench/compiler
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -O2
    dependencies:
      - coal
      - criterion >= 1.6 && < 1.7
      - deepseq >= 1.4 && < 1.6
