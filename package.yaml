name:                coal
version:             0.1.0.0
github:              "laserpants/coal"
license:             MIT
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2025 Author name here"

extra-source-files:
- README.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/laserpants/coal#readme>

dependencies:
- base >= 4.7 && < 5
- data-fix
- text
- text-show
- bytestring
- containers
- mtl
- data-fix
- parser-combinators
- free
- megaparsec
- extra
- recursion-schemes
- uniplate
- deriving-compat
- raw-strings-qq
- process
- prettyprinter
- filepath
- temporary
- directory
- file-embed

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -optP-Wno-nonportable-include-path 

library:
  source-dirs: src

executables:
  coal:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - coal
    - optparse-applicative

tests:
  coal-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - coal
    - hspec
