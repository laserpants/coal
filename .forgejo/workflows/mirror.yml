name: Mirror to GitHub

on:
  push:
    branches:
      - main
      - develop
      - next
    tags:
      - "**"

jobs:
  mirror:
    runs-on: codeberg-small

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror
        run: |
          git remote add github https://oauth2:${{ secrets.GH_TOKEN }}@github.com/laserpants/coal.git
          git push github --all

          # Only push tags when this workflow was triggered by a tag push
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            git push github "${GITHUB_REF}"
          fi
