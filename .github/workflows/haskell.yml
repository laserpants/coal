name: Haskell CI

on:
  push:
    branches: [ main, develop, next ]

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/laserpants/coal-dev:latest

    env:
      STACK_ROOT: /root/.stack

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: haskell-actions/setup@v2
        with:
          # Keep in sync with the GHC version used by the resolver in stack.yaml
          # (lts-24.50 -> ghc-9.10.3). Using "latest" pulls a newer GHC that no
          # longer compiles older hlint dependencies (conduit, ghc-lib-parser)
          # which use `~` in type signatures without the TypeOperators extension.
          ghc-version: '9.10.3'
          enable-stack: true

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml', 'package.yaml', '*.cabal') }}
          restore-keys: |
            stack-${{ runner.os }}-

      - name: Prepare
        run: bash runtime/scripts/combine.sh

      - name: Lint (HLint)
        run: |
          stack build hlint
          stack exec hlint -- src/ app/ test/

      - name: Build
        run: stack --allow-different-user build --test --no-run-tests

      - name: Test
        run: stack --allow-different-user test --ta '--match Unit' #  --match Kernel'

  macos-build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          brew install bdw-gc gmp llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify LLVM tools
        run: |
          command -v llvm-as
          llvm-as --version

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          enable-stack: true

      - name: Prepare
        run: bash runtime/scripts/combine.sh

      - name: Build
        run: stack build

      - name: Install Coal
        run: |
          stack install
          echo "$(stack path --local-bin)" >> "$GITHUB_PATH"

      - name: Check out hello-world project
        run: git clone https://codeberg.org/laserpants/coal-hello-world.git coal-hello-world

      - name: Build hello-world project
        working-directory: coal-hello-world
        run: coal build

      - name: Run hello-world program
        working-directory: coal-hello-world
        run: |
          output=$(./hello-world-0.1.0)
          echo "$output"
          test "$output" = "Hello, world!" 

